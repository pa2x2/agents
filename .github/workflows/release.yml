name: Release pa2-skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          check-latest: true
      - name: Test
        working-directory: src
        run: go test ./...
      - name: Package
        working-directory: src
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes src/dist/*.tar.gz src/dist/SHA256SUMS
