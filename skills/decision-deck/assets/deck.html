<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Decisions</title>
<style>
/* The theme is set on <html> as data-theme="light" or "dark" (see the script below), so visuals.css can
   adapt with [data-theme=dark] or use these variables for diagrams that should follow it. */
:root {
  color-scheme: light;
  --page: #eceef1; --page-card: #ffffff; --page-text: #16181d; --page-muted: #5d6470; --accent: #16181d; --accent-text: #ffffff;
  --raised: #eceef1; --keep: #178a4f; --change: #a86a00; --drop: #c62b27; --hl: #f59e0b;
}
:root[data-theme=dark] {
  color-scheme: dark;
  --page: #131519; --page-card: #1d2026; --page-text: #e6e8ec; --page-muted: #9aa1ac; --accent: #e6e8ec; --accent-text: #131519;
  --raised: #30343c; --keep: #45c486; --change: #e8b03a; --drop: #f0605c;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--page); color: var(--page-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

/* ---------- deck chrome ---------- */
.dk-top { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50; display: flex; align-items: center; gap: 14px;
  padding: 0 24px; background: var(--page); border-bottom: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); }
.dk-top h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
.dk-top label { font-size: 14px; color: var(--page-muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.dk-btn { font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 16px; border: 1px solid transparent;
  cursor: pointer; background: var(--accent); color: var(--accent-text); }
.dk-btn.dk-ghost { background: transparent; color: var(--page-text); border-color: color-mix(in srgb, var(--page-muted) 40%, transparent); }
.dk-btn:disabled { opacity: .35; cursor: default; }

.dk-deck { position: fixed; top: 56px; bottom: 56px; left: 0; right: 0; }
.dk-slide { display: none; position: absolute; inset: 0; padding: 16px 24px 12px; flex-direction: column; gap: 12px; }
.dk-slide.dk-on { display: flex; }
/* The summary is a page that scrolls, not a slide with a body. */
.dk-slide.dk-page.dk-on { display: block; overflow-y: auto; padding: 36px max(24px, calc(50% - 480px)); }
.dk-head { flex: none; display: flex; gap: 12px; align-items: center; }
.dk-head h2 { margin: 0; font-size: 20px; line-height: 1.3; }
.dk-num { font-weight: 700; font-size: 14px; background: var(--page-text); color: var(--page); border-radius: 999px; width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
/* Kind badges take their colour from --h, a hue set per kind in DECK.kinds. */
.dk-kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; display: inline-block;
  background: hsl(var(--h) 85% 92%); color: hsl(var(--h) 70% 30%); }
[data-theme=dark] .dk-kind { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 75% 78%); }

/* The slide body is free HTML. It scrolls when it is taller than the window. */
.dk-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; font-size: 14px; line-height: 1.5; padding: 4px 4px 12px 2px; }
.dk-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); margin: 20px 0 6px; }
.dk-body h3:first-child { margin-top: 4px; }
.dk-body ul { margin: 0; padding-left: 18px; } .dk-body li { margin: 0 0 5px; }
.dk-body pre { white-space: pre-wrap; } .dk-body :is(img, svg, video, table) { max-width: 100%; }
/* Text beside visuals: .dk-text is the text column, .dk-stage the visuals column. */
.dk-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 390px) 1fr; gap: 28px; }
.dk-text { min-height: 0; overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere; padding: 4px 8px 12px 2px; }
.dk-stage { display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; min-height: 0; }
.dk-refs { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--page-muted); margin-top: 8px; line-height: 1.5; }
.dk-hint { font-size: 12.5px; color: var(--page-muted); margin-top: 4px; }
.dk-lead { font-size: 15px; color: var(--page-muted); }

/* Answer controls a body can use. A question's label is bold, its options follow. */
.dk-q { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
.dk-option { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.4; cursor: pointer; margin: 0 0 6px; }
.dk-option span i { display: block; font-style: normal; color: var(--page-muted); font-size: 12.5px; }
.dk-option input { flex: none; margin: 2px 0 0; }
.dk-body :is(input:not([type=radio]):not([type=checkbox]):not([type=range]):not([type=hidden]), select, textarea) {
  font: inherit; font-size: 14px; border-radius: 10px; padding: 8px 12px; max-width: 100%; background: var(--page); color: var(--page-text);
  border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
.dk-body textarea:not(.dk-note) { display: block; width: 100%; min-height: 44px; margin-top: 8px; resize: vertical; }
.dk-pick { font: inherit; font-size: 13px; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: transparent; color: var(--page-text);
  border: 1px solid color-mix(in srgb, var(--page-muted) 40%, transparent); }
.dk-pick[aria-pressed=true] { background: var(--accent); color: var(--accent-text); border-color: transparent; }
/* A row or card that carries a decision or a note reads as one unit. */
.dk-body [data-decision], .dk-body .dk-item { background: var(--page-card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.dk-body [data-decision] p, .dk-body .dk-item p { margin: 0; }

.dk-decide { flex: none; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--page-card); }
.dk-decision { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; margin-top: 12px; }
.dk-seg { display: inline-flex; flex: none; background: color-mix(in srgb, var(--page-muted) 14%, transparent); border-radius: 999px; padding: 3px; gap: 2px; }
.dk-seg input { display: none; }
.dk-seg label { font-size: 14px; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: var(--page-muted); }
.dk-seg input:checked + label { background: var(--raised); color: var(--page-text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.dk-seg input[value=keep]:checked + label { color: var(--keep); } .dk-seg input[value=drop]:checked + label { color: var(--drop); }
.dk-seg input[value=change]:checked + label { color: var(--change); }
textarea.dk-note { flex: 1 1 240px; min-height: 44px; resize: vertical; font: inherit; font-size: 14px; border-radius: 12px; padding: 10px 12px;
  background: var(--page); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
/* "Change" with no note leaves the change unsaid; the box asks for it. */
textarea.dk-note.dk-want { border: 2px solid #e5a50a; }
textarea.dk-note.dk-want::placeholder { color: var(--change); }
/* A part tied to an answer can carry its own display, so hiding it has to win over that. */
.dk-off { display: none !important; }

.dk-shots { display: flex; flex-wrap: nowrap; gap: 26px; align-items: flex-start; }
.dk-shot { margin: 0; }
.dk-shot figcaption { font-size: 13.5px; margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; max-width: 420px; min-height: 38px; line-height: 18px; }
.dk-tagnow, .dk-tagnew { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; text-transform: uppercase; letter-spacing: .04em; flex: none; }
.dk-tagnow { background: color-mix(in srgb, var(--page-muted) 22%, transparent); color: var(--page-muted); }
.dk-tagnew { background: var(--hl); color: #1a1200; }
.dk-shot figcaption span:last-child { color: var(--page-muted); }

/* ---------- change highlight ----------
   .hl is a block wrapper with position: relative for its tag.
   - "inline": wraps in an inline-block span instead, for a label in a row or a value in a table cell.
   - "abs": for an overlay, popover or dialog. The wrapper becomes the absolutely positioned box, so put
     the position (top/right/...) in hl()'s style argument and give the inner element position: static.
     Its z-index keeps it above a scrim drawn after it.
   The tag sits above the outline's top-right corner, outside the box: an ancestor with overflow: hidden
   clips it, and outlines close together overlap their tags. */
.hl { position: relative; outline: 2px dashed var(--hl); outline-offset: 3px; border-radius: 12px; }
.hl.inline { display: inline-block; vertical-align: middle; }
.hl.abs { position: absolute; z-index: 30; }
.hl[data-tag]::after { content: attr(data-tag); position: absolute; top: -13px; right: -4px; background: var(--hl); color: #1a1200;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; z-index: 40; white-space: nowrap; font-family: Helvetica, Arial, sans-serif; }
body.dk-nohl .hl { outline: none; } body.dk-nohl .hl::after { display: none; }

.dk-page h1 { font-size: 34px; margin: 0 0 12px; }
.dk-page .dk-lead { font-size: 16px; line-height: 1.6; max-width: 820px; }
.dk-toc { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; max-width: 820px; }
.dk-toc button { font: inherit; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; border: none;
  background: var(--page-card); color: var(--page-text); cursor: pointer; font-size: 15.5px; }
.dk-toc button:hover { outline: 2px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
.dk-toc button .dk-kind { margin-left: auto; }
.dk-toc button .dk-state { font-size: 12px; font-weight: 700; width: 92px; text-align: right; text-transform: uppercase; }
.dk-state.dk-keep { color: var(--keep); } .dk-state.dk-change { color: var(--change); } .dk-state.dk-drop { color: var(--drop); } .dk-state.dk-undecided { color: var(--page-muted); font-weight: 500; }
.dk-summary textarea { width: 100%; height: 34vh; font-family: ui-monospace, monospace; font-size: 13px; border-radius: 14px; padding: 14px;
  background: var(--page-card); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); margin-top: 18px; }
.dk-summary .dk-row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
.dk-summary .dk-row span { color: var(--page-muted); font-size: 13px; }

.dk-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 16px;
  border-top: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); background: var(--page); z-index: 50; }
.dk-dots { display: flex; gap: 8px; align-items: center; }
.dk-dots button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700;
  background: color-mix(in srgb, var(--page-muted) 18%, transparent); color: var(--page-muted); padding: 0; }
.dk-dots button.dk-on { border-color: var(--page-text); color: var(--page-text); }
.dk-dots button.dk-keep { background: #1fa46333; color: var(--keep); } .dk-dots button.dk-change { background: #e5a50a33; color: var(--change); }
.dk-dots button.dk-drop { background: #e02e2a33; color: var(--drop); }
.dk-counter { font-size: 13px; color: var(--page-muted); min-width: 120px; text-align: center; }
.dk-hintkeys { position: fixed; right: 24px; bottom: 18px; font-size: 12.5px; color: var(--page-muted); z-index: 51; }
.dk-hintkeys kbd { font-family: inherit; font-size: 12px; border: 1px solid color-mix(in srgb, var(--page-muted) 45%, transparent); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 5px; background: var(--page-card); color: var(--page-text); }
.dk-error { position: fixed; top: 64px; left: 24px; right: 24px; z-index: 100; margin: 0; padding: 12px 16px; border-radius: 12px;
  background: #c62b27; color: #fff; font-size: 13px; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="visuals.css" />
<script>
// The theme is a viewer's preference, so it is kept under one key for every deck, apart from the
// answers. "auto" follows the system. Set here, before the body renders, so the page doesn't flash.
const THEME_KEY = "decision-deck:theme";
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const themePref = () => localStorage.getItem(THEME_KEY) ?? "auto";
const applyTheme = () => {
  const pref = themePref();
  document.documentElement.dataset.theme = pref === "auto" ? (darkQuery.matches ? "dark" : "light") : pref;
};
applyTheme();
darkQuery.addEventListener("change", applyTheme);
</script>
</head>
<body>
<div class="dk-top">
  <h1 id="deckTitle"></h1>
  <label><input type="checkbox" id="hlToggle" checked autocomplete="off" /> Highlight changes</label>
  <button class="dk-btn dk-ghost" id="themeBtn"></button>
  <button class="dk-btn dk-ghost" id="resetBtn">Reset answers</button>
  <button class="dk-btn" id="exportBtn">Export decisions</button>
</div>
<div class="dk-deck" id="deck"></div>
<div class="dk-bottom">
  <button class="dk-btn dk-ghost" id="prevBtn">← Prev</button>
  <div class="dk-dots" id="dots"></div>
  <span class="dk-counter" id="counter"></span>
  <button class="dk-btn dk-ghost" id="nextBtn">Next →</button>
</div>
<div class="dk-hintkeys"><kbd>←</kbd> <kbd>→</kbd> to navigate</div>
<script>
// An error in visuals.js, content.js or the deck script stops it before anything renders. This
// separate script still runs, so the error shows on the page instead of a blank deck. Listening in
// the capture phase also catches a file that fails to load, such as a missing visuals.js.
window.addEventListener("error", (e) => {
  const bar = document.createElement("pre");
  bar.className = "dk-error";
  const file = (url) => url.split("/").pop().split(/[?#]/)[0] || "index.html";
  const failed = e.target?.src ?? e.target?.href;
  bar.textContent = failed ? `Deck error: couldn't load ${file(failed)}`
    : `Deck error: ${e.message}${e.lineno ? ` (${file(e.filename ?? "")} line ${e.lineno})` : ""}`;
  document.body.append(bar);
}, true);
</script>
<script>
// ---------- helpers ----------
const hl = (tag, html, cls = "", style = "") => {
  const el = cls.split(" ").includes("inline") ? "span" : "div";
  return `<${el} class="hl ${cls}" ${tag ? `data-tag="${tag}"` : ""} style="${style}">${html}</${el}>`;
};
// kind is "now" (current state) or "new" (proposed). html is any markup: a UI mockup, a diagram,
// before/after code, a table, a screenshot. when ties the shot to answers, e.g. { layout: "grid" }: it
// shows only while the answer to layout is grid (for a set: while grid is checked). The same
// data-when="key=value" on an element inside a shot shows or hides that part.
const shot = (kind, caption, html, when = null) =>
  `<figure class="dk-shot" ${when ? `data-when="${Object.entries(when).map(([k, v]) => `${k}=${v}`).join("&")}"` : ""}><figcaption><span class="${kind === "now" ? "dk-tagnow" : "dk-tagnew"}">${kind === "now" ? "Now" : "Proposed"}</span><span>${caption}</span></figcaption>${html}</figure>`;
</script>
<script src="visuals.js"></script>
<script src="content.js"></script>
<script>
// ---------- rendering ----------
// A missing DECK or SLIDES means content.js failed; its error is already on the page.
try { DECK; SLIDES; } catch { throw new Error("content.js didn't define DECK and SLIDES; see the error above"); }
const KEY = DECK.storageKey;
const state = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const attr = (s) => String(s ?? "").replace(/[&"<>]/g, (c) => ({ "&": "&amp;", '"': "&quot;", "<": "&lt;", ">": "&gt;" }[c]));
const kindBadge = (k) => `<span class="dk-kind" style="--h:${DECK.kinds[k]?.hue ?? 220}">${DECK.kinds[k]?.label ?? k}</span>`;

// Ids name the decisions and the saved answers, so each must be unique in the deck.
const ids = new Set(["summary"]);
const claim = (id) => {
  if (!/^[A-Za-z][\w-]*$/.test(id)) throw new Error(`Bad id "${id}": start with a letter, then letters, digits, - or _`);
  if (ids.has(id)) throw new Error(`Duplicate id "${id}" in content.js`);
  ids.add(id);
  return id;
};
SLIDES.forEach((s) => claim(s.id));

const decisionSeg = (id) => `<div class="dk-seg">${["keep", "change", "drop"].map((v) =>
  `<input type="radio" name="${id}-d" id="${id}-${v}" value="${v}" data-id="${id}" data-f="decision"><label for="${id}-${v}">${v[0].toUpperCase() + v.slice(1)}</label>`).join("")}</div>`;
const noteBox = (id) => `<textarea class="dk-note" data-id="${id}" data-f="note" placeholder="Notes"></textarea>`;

let html = SLIDES.map((s, i) => `<section class="dk-slide" data-key="${s.id}">
  <div class="dk-head"><span class="dk-num">${i + 1}</span><h2>${s.title}</h2>${s.kind ? kindBadge(s.kind) : ""}</div>
  <div class="dk-body">${s.body}</div>
  ${s.decision === false ? "" : `<div class="dk-decide">${decisionSeg(s.id)}${noteBox(s.id)}</div>`}
</section>`).join("");
html += `<section class="dk-slide dk-page dk-summary" data-key="summary"><h1>Your decisions</h1>
  <div class="dk-toc" id="toc"></div>
  <p class="dk-lead">Copy this and paste it back into the chat. Anything left undecided is listed as UNDECIDED. On undecided and dropped slides, only the answers you changed are listed.</p>
  <textarea id="exportText" readonly></textarea>
  <div class="dk-row"><button class="dk-btn" id="copyBtn">Copy</button><span id="copied"></span></div></section>`;
document.getElementById("deck").innerHTML = html;

const els = [...document.querySelectorAll(".dk-slide")];
const slideEl = (id) => document.querySelector(`.dk-slide[data-key="${id}"]`);
const pages = [...SLIDES, { id: "summary", title: "Your decisions", decision: false }];
document.title = DECK.title;
document.getElementById("deckTitle").textContent = DECK.title;

// Each data-decision element gets the Keep / Change / Drop bar and a note, so one slide can hold many decisions.
const decisionIds = SLIDES.filter((s) => s.decision !== false).map((s) => s.id);
for (const s of SLIDES) for (const el of slideEl(s.id).querySelectorAll("[data-decision]")) {
  decisionIds.push(claim(el.dataset.decision));
  el.insertAdjacentHTML("beforeend", `<div class="dk-decision">${decisionSeg(el.dataset.decision)}${noteBox(el.dataset.decision)}</div>`);
}
// Radios that share a key form one question; the browser only unchecks the others when they share a name.
for (const s of SLIDES) for (const r of slideEl(s.id).querySelectorAll('input[type="radio"][data-answer]')) r.name ||= `${s.id}--${r.dataset.answer}`;

// ---------- answers ----------
// An answer is the value of a question: the elements that share a data-answer key. Radios give the checked
// value, checkboxes a list of checked values, anything else the field's value.
const groupOf = (root, key) => [...root.querySelectorAll("[data-answer]")].filter((el) => el.dataset.answer === key);
const keysOf = (root) => [...new Set([...root.querySelectorAll("[data-answer]")].map((el) => el.dataset.answer))];
function valueOf(group) {
  const type = group[0].type;
  if (type === "radio") return group.find((el) => el.checked)?.value ?? null;
  if (type === "checkbox") return group.filter((el) => el.checked).map((el) => el.value);
  return group[0].value;
}
function applyValue(group, value) {
  const type = group[0].type;
  if (type === "radio") group.forEach((el) => (el.checked = el.value === value));
  else if (type === "checkbox") group.forEach((el) => (el.checked = value.includes(el.value)));
  else group.forEach((el) => (el.value = value));
}
// The export's text for an answer: the option's label for choices, the field's text for values.
const optionLabel = (el) => el.dataset.option ?? el.closest("label")?.textContent.trim() ?? el.value;
function shownValue(group) {
  const el = group[0];
  if (el.type === "checkbox") return group.filter((x) => x.checked).map(optionLabel);
  if (el.type === "radio") { const on = group.find((x) => x.checked); return on ? optionLabel(on) : "(none)"; }
  if (el.tagName === "SELECT") { const o = el.selectedOptions[0]; return o ? (o.dataset.option ?? o.text) : "(empty)"; }
  return el.value.trim() === "" ? "(empty)" : el.value;
}
// data-when="key=value&key2=value2" shows an element only while the slide's answers match.
function showWhen(root) {
  for (const el of root.querySelectorAll("[data-when]")) {
    const on = el.dataset.when.split("&").every((pair) => {
      const i = pair.indexOf("=");
      const group = i > 0 ? groupOf(root, pair.slice(0, i)) : [];
      if (!group.length) return false;
      const value = valueOf(group);
      return Array.isArray(value) ? value.includes(pair.slice(i + 1)) : value === pair.slice(i + 1);
    });
    el.hidden = !on;
    el.classList.toggle("dk-off", !on);
  }
}

const decisionOf = (id) => state[id]?.decision ?? "undecided";
function markWant(id) {
  const box = document.querySelector(`textarea.dk-note[data-id="${id}"]`);
  box.dataset.placeholder ??= box.placeholder;
  const want = decisionOf(id) === "change" && !state[id]?.note?.trim();
  box.classList.toggle("dk-want", want);
  box.placeholder = want ? "Say what to change" : box.dataset.placeholder;
}

// Restore what the user saved. Then the scripts in the bodies run, so they see the saved answers.
for (const id of decisionIds) {
  const saved = state[id] ?? {};
  if (saved.decision) document.getElementById(`${id}-${saved.decision}`).checked = true;
  document.querySelector(`textarea.dk-note[data-id="${id}"]`).value = saved.note ?? "";
  markWant(id);
}
for (const s of SLIDES) {
  const root = slideEl(s.id);
  for (const [key, value] of Object.entries(state[s.id]?.answers ?? {})) {
    const group = groupOf(root, key);
    if (group.length) applyValue(group, value);
  }
}
// Scripts inserted as HTML don't run, so each one is swapped for a live copy.
for (const s of SLIDES) for (const old of slideEl(s.id).querySelectorAll(".dk-body script")) {
  const live = document.createElement("script");
  live.textContent = old.textContent;
  old.replaceWith(live);
}
for (const s of pages) showWhen(slideEl(s.id));

// Answers, decisions and notes are saved as they change. A radio or box that was just clicked blurs, so the
// arrow keys go on moving slides instead of changing it.
document.addEventListener("input", onChange);
document.addEventListener("change", onChange);
function onChange(e) {
  const t = e.target;
  if (t.dataset.answer !== undefined) {
    const root = t.closest(".dk-slide");
    const saved = (state[root.dataset.key] ??= {});
    saved.answers ??= {};
    saved.answers[t.dataset.answer] = valueOf(groupOf(root, t.dataset.answer));
    save();
    showWhen(root);
    fit();
  } else if (t.dataset.f === "decision") {
    (state[t.dataset.id] ??= {}).decision = t.value;
    save();
    markWant(t.dataset.id);
    renderNav();
  } else if (t.dataset.f === "note") {
    (state[t.dataset.id] ??= {}).note = t.value;
    save();
    markWant(t.dataset.id);
  }
  if (t.type === "radio" || t.type === "checkbox") t.blur();
}
// Clicking the selected decision again clears it. A click on an already checked radio fires no change event.
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t.matches?.('input[data-f="decision"]') || decisionOf(t.dataset.id) !== t.value) return;
  t.checked = false;
  delete state[t.dataset.id].decision;
  save();
  markWant(t.dataset.id);
  renderNav();
  t.blur();
});

// ---------- export ----------
function exportText() {
  const lines = [`${DECK.title}: decisions`, ""];
  const note = (id) => state[id]?.note?.trim();
  const indent = (text, pad) => text.replace(/\n/g, `\n${pad}`);
  SLIDES.forEach((s, i) => {
    const root = slideEl(s.id);
    const d = decisionOf(s.id);
    const decides = s.decision !== false;
    lines.push(`${i + 1}. ${s.title}${decides ? `: ${d.toUpperCase()}` : ""}`);
    // Keep and Change list every answer, with the proposed ones. Undecided, dropped and slides without a
    // decision list only the answers the user changed.
    const all = decides && (d === "keep" || d === "change");
    for (const key of keysOf(root)) {
      if (!all && state[s.id]?.answers?.[key] === undefined) continue;
      const group = groupOf(root, key);
      const label = (group[0].dataset.label ?? key).replace(/[?:]$/, "");
      const shown = shownValue(group);
      if (Array.isArray(shown)) lines.push(`   ${label}:`, ...(shown.length ? shown.map((v) => `     - ${v}`) : ["     (none)"]));
      else lines.push(`   ${label}: ${indent(shown, "         ")}`);
    }
    if (note(s.id)) lines.push(`   Note: ${indent(note(s.id), "         ")}`);
    for (const el of root.querySelectorAll("[data-decision]")) {
      const id = el.dataset.decision;
      lines.push(`   - ${el.dataset.label ?? id}: ${decisionOf(id).toUpperCase()}`);
      if (note(id)) lines.push(`     Note: ${indent(note(id), "           ")}`);
    }
  });
  return lines.join("\n");
}

// ---------- navigation ----------
// #N in the URL, the dots' data-go and the list's data-toc all count slides from 1, like the slide numbers.
const fromHash = () => (parseInt(location.hash.slice(1), 10) || 1) - 1;
let current = Math.min(Math.max(fromHash(), 0), els.length - 1);

// The decision a slide shows on its dot and in the list: its own bar, and each data-decision inside it.
// Nothing is shown when a slide has no decision.
function slideDecision(s) {
  const decisions = [];
  if (s.decision !== false) decisions.push(decisionOf(s.id));
  for (const el of slideEl(s.id).querySelectorAll("[data-decision]")) decisions.push(decisionOf(el.dataset.decision));
  if (!decisions.length) return "";
  if (decisions.includes("undecided")) return "undecided";
  if (decisions.includes("change")) return "change";
  return decisions.every((d) => d === "drop") ? "drop" : "keep";
}

function renderNav() {
  document.getElementById("dots").innerHTML = pages.map((p, i) => {
    const d = slideDecision(p);
    return `<button class="${i === current ? "dk-on" : ""} ${d ? `dk-${d}` : ""}" data-go="${i + 1}" title="${attr(p.title)}">${i === pages.length - 1 ? "✓" : i + 1}</button>`;
  }).join("");
  document.getElementById("toc").innerHTML = SLIDES.map((s, i) => {
    const d = slideDecision(s);
    return `<button data-toc="${i + 1}"><span class="dk-num">${i + 1}</span>${s.title}${s.kind ? `<span style="margin-left:auto">${kindBadge(s.kind)}</span>` : ""}${d ? `<span class="dk-state dk-${d}">${d}</span>` : ""}</button>`;
  }).join("");
}

// Scale the visuals so everything in a stage fits without scrolling. Small visuals grow too, up to
// MAX_ZOOM, so they don't sit in a mostly empty stage on a large window.
const MAX_ZOOM = 1.4;
function fit() {
  for (const shots of els[current].querySelectorAll(".dk-shots")) {
    shots.style.zoom = 1;
    const stage = shots.closest(".dk-stage");
    if (!stage) continue;
    const box = stage.getBoundingClientRect();
    shots.style.zoom = Math.min(MAX_ZOOM, (box.width - 8) / shots.scrollWidth, (box.height - 8) / shots.scrollHeight);
  }
}

function go(i) {
  current = Math.min(Math.max(i, 0), els.length - 1);
  els.forEach((el, j) => el.classList.toggle("dk-on", j === current));
  history.replaceState(null, "", `#${current + 1}`);
  document.getElementById("counter").textContent = `${current + 1} / ${els.length}`;
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === els.length - 1;
  if (pages[current].id === "summary") { document.getElementById("exportText").value = exportText(); document.getElementById("copied").textContent = ""; }
  renderNav();
  fit();
}

// The contents list uses data-toc, so [data-go="N"] matches exactly one element: the dot.
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go], [data-toc]");
  if (b) go(+(b.dataset.go ?? b.dataset.toc) - 1);
});
window.addEventListener("hashchange", () => go(fromHash()));
document.addEventListener("keydown", (e) => {
  // Keys that edit a field (text, number, range, select, a textarea) stay with it. A radio or box has blurred after a click.
  const t = e.target;
  const editing = t instanceof Element && t.matches("textarea, select, input") && !["radio", "checkbox"].includes(t.type);
  if (editing || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { go(current + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { go(current - 1); e.preventDefault(); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(els.length - 1);
});
window.addEventListener("resize", fit);
document.fonts.ready.then(fit);

document.getElementById("prevBtn").onclick = () => go(current - 1);
document.getElementById("nextBtn").onclick = () => go(current + 1);
document.getElementById("exportBtn").onclick = () => go(els.length - 1);
document.getElementById("copyBtn").onclick = async () => {
  const t = document.getElementById("exportText");
  try { await navigator.clipboard.writeText(t.value); document.getElementById("copied").textContent = "Copied"; }
  catch { t.select(); document.getElementById("copied").textContent = "Press Ctrl+C to copy the selection"; }
};
document.getElementById("resetBtn").onclick = () => { if (confirm("Clear all answers?")) { localStorage.removeItem(KEY); location.reload(); } };
// The highlight setting is kept apart from the answers, so "Reset answers" leaves it as it is.
const HL_KEY = `${KEY}:highlight`;
const setHighlight = (on) => { document.getElementById("hlToggle").checked = on; document.body.classList.toggle("dk-nohl", !on); };
setHighlight(localStorage.getItem(HL_KEY) !== "off");
document.getElementById("hlToggle").onchange = (e) => {
  setHighlight(e.target.checked);
  localStorage.setItem(HL_KEY, e.target.checked ? "on" : "off");
  e.target.blur();
};
const THEMES = ["auto", "light", "dark"];
const themeBtn = document.getElementById("themeBtn");
const showTheme = () => { const t = themePref(); themeBtn.textContent = `Theme: ${t[0].toUpperCase() + t.slice(1)}`; };
showTheme();
themeBtn.onclick = () => {
  localStorage.setItem(THEME_KEY, THEMES[(THEMES.indexOf(themePref()) + 1) % THEMES.length]);
  applyTheme();
  showTheme();
  themeBtn.blur();
};
go(current);
</script>
</body>
</html>
