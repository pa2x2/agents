<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Decisions</title>
<style>
:root {
  --page: #eceef1; --page-card: #ffffff; --page-text: #16181d; --page-muted: #5d6470; --accent: #16181d; --hl: #f59e0b;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--page); color: var(--page-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

/* ---------- deck chrome ---------- */
.dk-top { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50; display: flex; align-items: center; gap: 14px;
  padding: 0 24px; background: var(--page); border-bottom: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); }
.dk-top h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
.dk-top label { font-size: 14px; color: var(--page-muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.dk-btn { font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 16px; border: 1px solid transparent;
  cursor: pointer; background: var(--accent); color: #fff; }
.dk-btn.dk-ghost { background: transparent; color: var(--page-text); border-color: color-mix(in srgb, var(--page-muted) 40%, transparent); }
.dk-btn:disabled { opacity: .35; cursor: default; }

.dk-deck { position: fixed; top: 56px; bottom: 56px; left: 0; right: 0; }
.dk-slide { display: none; position: absolute; inset: 0; padding: 20px 24px 12px; }
.dk-slide.dk-on { display: grid; grid-template-columns: minmax(330px, 390px) 1fr; gap: 28px; }
.dk-slide.dk-page.dk-on { display: block; overflow-y: auto; padding: 36px max(24px, calc(50% - 480px)); }
/* Long words (code identifiers, file paths) wrap instead of scrolling the side sideways; overflow-x
   clips whatever still can't shrink. */
.dk-side { overflow-y: auto; overflow-x: hidden; overflow-wrap: anywhere; padding: 4px 8px 12px 2px; min-height: 0; }
.dk-side pre { white-space: pre-wrap; } .dk-side :is(img, svg, video, table) { max-width: 100%; }
.dk-stage { display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; min-height: 0; }

.dk-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 16px;
  border-top: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); background: var(--page); z-index: 50; }
.dk-dots { display: flex; gap: 8px; align-items: center; }
.dk-dots button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700;
  background: color-mix(in srgb, var(--page-muted) 18%, transparent); color: var(--page-muted); padding: 0; }
.dk-dots button.dk-on { border-color: var(--page-text); color: var(--page-text); }
.dk-dots button.dk-keep { background: #1fa46333; color: #178a4f; } .dk-dots button.dk-change { background: #e5a50a33; color: #a86a00; }
.dk-dots button.dk-drop { background: #e02e2a33; color: #c62b27; }
.dk-counter { font-size: 13px; color: var(--page-muted); min-width: 120px; text-align: center; }
.dk-hintkeys { position: fixed; right: 24px; bottom: 18px; font-size: 12.5px; color: var(--page-muted); z-index: 51; }
.dk-hintkeys kbd { font-family: inherit; font-size: 12px; border: 1px solid color-mix(in srgb, var(--page-muted) 45%, transparent); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 5px; background: var(--page-card); color: var(--page-text); }

.dk-side header { display: flex; gap: 12px; align-items: flex-start; }
.dk-num { font-weight: 700; font-size: 14px; background: var(--page-text); color: var(--page); border-radius: 999px; width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 2px; }
.dk-side h2 { margin: 0; font-size: 20px; line-height: 1.3; }
/* Kind badges take their colour from --h, a hue set per kind in DECK.kinds. */
.dk-kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; display: inline-block;
  background: hsl(var(--h) 85% 92%); color: hsl(var(--h) 70% 30%); }
.dk-side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); margin: 20px 0 6px; }
.dk-side ul { margin: 0; padding-left: 18px; } .dk-side li { font-size: 14px; line-height: 1.5; margin: 0 0 5px; }
.dk-refs { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--page-muted); margin-top: 8px; line-height: 1.5; }

.dk-decide { margin-top: 20px; padding: 16px; border-radius: 16px; background: var(--page-card); display: flex; flex-direction: column; gap: 14px; }
.dk-decide .dk-lbl { font-size: 12px; font-weight: 700; color: var(--page-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.dk-seg { display: inline-flex; background: color-mix(in srgb, var(--page-muted) 14%, transparent); border-radius: 999px; padding: 3px; gap: 2px; }
.dk-seg input { display: none; }
.dk-seg label { font-size: 14px; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: var(--page-muted); }
.dk-seg input:checked + label { background: var(--page); color: var(--page-text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.dk-seg input[value=keep]:checked + label { color: #178a4f; } .dk-seg input[value=drop]:checked + label { color: #c62b27; }
.dk-seg input[value=change]:checked + label { color: #a86a00; }
.dk-variant { display: flex; flex-direction: column; gap: 6px; }
.dk-variant .dk-q { font-size: 14px; font-weight: 600; }
.dk-variant label { font-size: 14px; display: flex; gap: 8px; align-items: baseline; cursor: pointer; line-height: 1.4; }
.dk-variant label span i { display: block; font-style: normal; color: var(--page-muted); font-size: 12.5px; }
textarea.dk-note { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; border-radius: 12px; padding: 10px 12px;
  background: var(--page); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
/* "Change" with no note leaves the change unsaid; the box asks for it. */
textarea.dk-note.dk-want { border: 2px solid #e5a50a; }
textarea.dk-note.dk-want::placeholder { color: #a86a00; }

.dk-shots { display: flex; flex-wrap: nowrap; gap: 26px; align-items: flex-start; }
.dk-shot { margin: 0; }
.dk-shot figcaption { font-size: 13.5px; margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; max-width: 420px; min-height: 38px; line-height: 18px; }
.dk-tagnow, .dk-tagnew { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; text-transform: uppercase; letter-spacing: .04em; flex: none; }
.dk-tagnow { background: color-mix(in srgb, var(--page-muted) 22%, transparent); color: var(--page-muted); }
.dk-tagnew { background: var(--hl); color: #1a1200; }
.dk-shot figcaption span:last-child { color: var(--page-muted); }

.dk-page h1 { font-size: 34px; margin: 0 0 12px; }
.dk-page .dk-lead { font-size: 16px; line-height: 1.6; color: var(--page-muted); max-width: 820px; }
.dk-page .dk-lead b { color: var(--page-text); }
.dk-toc { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; max-width: 820px; }
.dk-toc button { font: inherit; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; border: none;
  background: var(--page-card); color: var(--page-text); cursor: pointer; font-size: 15.5px; }
.dk-toc button:hover { outline: 2px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
.dk-toc button .dk-kind { margin-left: auto; }
.dk-toc button .dk-state { font-size: 12px; font-weight: 700; width: 64px; text-align: right; text-transform: uppercase; }
.dk-state.dk-keep { color: #178a4f; } .dk-state.dk-change { color: #a86a00; } .dk-state.dk-drop { color: #c62b27; } .dk-state.dk-undecided { color: var(--page-muted); font-weight: 500; }
.dk-smalls { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 960px; }
.dk-small { display: grid; grid-template-columns: 1fr auto; gap: 10px 22px; padding: 16px 18px; border-radius: 16px; background: var(--page-card); }
.dk-small p { margin: 0; font-size: 14.5px; line-height: 1.5; }
.dk-small p .dk-stitle { display: block; font-weight: 700; font-size: 15.5px; margin-bottom: 3px; }
.dk-small textarea { grid-column: 1 / -1; min-height: 44px; }
.dk-small.dk-checked { grid-template-columns: 1fr; }
.dk-state.dk-noted { color: #a86a00; }
.dk-summary textarea { width: 100%; height: 34vh; font-family: ui-monospace, monospace; font-size: 13px; border-radius: 14px; padding: 14px;
  background: var(--page-card); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); margin-top: 18px; }
.dk-summary .dk-row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
.dk-summary .dk-row span { color: var(--page-muted); font-size: 13px; }

/* ---------- change highlight ----------
   .hl is a block wrapper with position: relative for its tag.
   - "inline": wraps in an inline-block span instead, for a label in a row or a value in a table cell.
   - "abs": for an overlay, popover or dialog. The wrapper becomes the absolutely positioned box, so put
     the position (top/right/...) in hl()'s style argument and give the inner element position: static.
     Its z-index keeps it above a scrim drawn after it.
   The tag sits above the outline's top-right corner, outside the box: an ancestor with overflow: hidden
   clips it, and outlines close together overlap their tags. */
.hl { position: relative; outline: 2px dashed var(--hl); outline-offset: 3px; border-radius: 12px; }
.hl.inline { display: inline-block; vertical-align: middle; }
.hl.abs { position: absolute; z-index: 30; }
.hl[data-tag]::after { content: attr(data-tag); position: absolute; top: -13px; right: -4px; background: var(--hl); color: #1a1200;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; z-index: 40; white-space: nowrap; font-family: Helvetica, Arial, sans-serif; }
body.dk-nohl .hl { outline: none; } body.dk-nohl .hl::after { display: none; }
.dk-error { position: fixed; top: 64px; left: 24px; right: 24px; z-index: 100; margin: 0; padding: 12px 16px; border-radius: 12px;
  background: #c62b27; color: #fff; font-size: 13px; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="visuals.css" />
</head>
<body>
<div class="dk-top">
  <h1 id="deckTitle"></h1>
  <label><input type="checkbox" id="hlToggle" checked /> Highlight changes</label>
  <button class="dk-btn dk-ghost" id="resetBtn">Reset answers</button>
  <button class="dk-btn" id="exportBtn">Export decisions</button>
</div>
<div class="dk-deck" id="deck"></div>
<div class="dk-bottom">
  <button class="dk-btn dk-ghost" id="prevBtn">← Prev</button>
  <div class="dk-dots" id="dots"></div>
  <span class="dk-counter" id="counter"></span>
  <button class="dk-btn dk-ghost" id="nextBtn">Next →</button>
</div>
<div class="dk-hintkeys"><kbd>←</kbd> <kbd>→</kbd> to navigate</div>
<script>
// An error in visuals.js, content.js or the deck script stops it before anything renders. This
// separate script still runs, so the error shows on the page instead of a blank deck. Listening in
// the capture phase also catches a file that fails to load, such as a missing visuals.js.
window.addEventListener("error", (e) => {
  const bar = document.createElement("pre");
  bar.className = "dk-error";
  const file = (url) => url.split("/").pop().split(/[?#]/)[0] || "index.html";
  const failed = e.target?.src ?? e.target?.href;
  bar.textContent = failed ? `Deck error: couldn't load ${file(failed)}`
    : `Deck error: ${e.message}${e.lineno ? ` (${file(e.filename ?? "")} line ${e.lineno})` : ""}`;
  document.body.append(bar);
}, true);
</script>
<script>
// ---------- helpers ----------
const hl = (tag, html, cls = "", style = "") => {
  const el = cls.split(" ").includes("inline") ? "span" : "div";
  return `<${el} class="hl ${cls}" ${tag ? `data-tag="${tag}"` : ""} style="${style}">${html}</${el}>`;
};
// kind is "now" (current state) or "new" (proposed). html is any markup: a UI mockup, a diagram,
// before/after code, a table, a screenshot. when ties the shot to variant options, e.g. { layout: "grid" }:
// it only shows while that option is selected, so a slide shows one proposed visual at a time.
const shot = (kind, caption, html, when = null) =>
  `<figure class="dk-shot" ${when ? `data-when="${Object.entries(when).map(([k, v]) => `${k}=${v}`).join("&")}"` : ""}><figcaption><span class="${kind === "now" ? "dk-tagnow" : "dk-tagnew"}">${kind === "now" ? "Now" : "Proposed"}</span><span>${caption}</span></figcaption>${html}</figure>`;
</script>
<script src="visuals.js"></script>
<script src="content.js"></script>
<script>
// ---------- rendering + decisions ----------
// If content.js failed, its error is already on the page and there is nothing to render.
try { DECK; P; } catch { throw new Error("content.js didn't define DECK and P; see the error above"); }
const KEY = DECK.storageKey;
const state = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const decisionOf = (id) => state[id]?.decision ?? "undecided";
const kindBadge = (k) => `<span class="dk-kind" style="--h:${DECK.kinds[k]?.hue ?? 220}">${DECK.kinds[k]?.label ?? k}</span>`;
P.forEach((p, i) => { p.n = i + 1; p.variants ??= []; });
// SMALL and CHECKED are optional, so a follow-up deck can leave them out.
const small = typeof SMALL === "undefined" ? [] : SMALL;
const checked = typeof CHECKED === "undefined" ? [] : CHECKED;
const smallN = P.length + 1;
const checkedN = P.length + (small.length ? 1 : 0) + 1;

const decisionSeg = (id) => `<div class="dk-seg">${["keep", "change", "drop"].map((v) =>
  `<input type="radio" name="${id}-d" id="${id}-${v}" value="${v}" data-id="${id}" data-f="decision"><label for="${id}-${v}">${v[0].toUpperCase() + v.slice(1)}</label>`).join("")}</div>`;

const slides = [...P.map((p) => ({ key: p.id, label: String(p.n), p })),
  ...(small.length ? [{ key: "small", label: String(smallN) }] : []),
  ...(checked.length ? [{ key: "checked", label: String(checkedN) }] : []), { key: "summary", label: "✓" }];

document.title = DECK.title;
document.getElementById("deckTitle").textContent = DECK.title;

let html = "";

for (const p of P) {
  html += `<section class="dk-slide" data-key="${p.id}"><div class="dk-side">
    <header><span class="dk-num">${p.n}</span><div><h2>${p.title}</h2><div style="margin-top:6px">${kindBadge(p.kind)}</div></div></header>
    <h3>Problem</h3><ul>${p.problem.map((x) => `<li>${x}</li>`).join("")}</ul>
    <h3>Proposal</h3><ul>${p.proposal.map((x) => `<li>${x}</li>`).join("")}</ul>
    ${p.refs ? `<div class="dk-refs">${p.refs}</div>` : ""}
    <div class="dk-decide"><div><div class="dk-lbl">Decision</div>${decisionSeg(p.id)}</div>
    ${p.variants.map((v) => `<div class="dk-variant"><div class="dk-q">${v.q}</div>${v.options.map(([val, label, hint], i) =>
      `<label><input type="radio" name="${p.id}-${v.key}" value="${val}" data-id="${p.id}" data-f="${v.key}" ${i === 0 ? "data-default" : ""}><span>${label}${i === 0 ? " (proposed)" : ""}${hint ? `<i>${hint}</i>` : ""}</span></label>`).join("")}</div>`).join("")}
    <div><div class="dk-lbl">Notes</div><textarea class="dk-note" data-id="${p.id}" data-f="note" placeholder="What would you change?"></textarea></div></div>
  </div><div class="dk-stage"><div class="dk-shots">${p.shots.join("")}</div></div></section>`;
}

if (small.length) {
  html += `<section class="dk-slide dk-page" data-key="small"><header style="display:flex;gap:12px;align-items:center"><span class="dk-num">${smallN}</span><h1 style="margin:0;font-size:26px">Small fixes</h1></header>
    <div class="dk-smalls">${small.map((s) => `<div class="dk-small"><p><span class="dk-stitle">${s.title}</span>${s.text}</p><div>${decisionSeg(s.id)}</div>
    <textarea class="dk-note" data-id="${s.id}" data-f="note" placeholder="Notes"></textarea></div>`).join("")}</div></section>`;
}

if (checked.length) {
  html += `<section class="dk-slide dk-page" data-key="checked"><header style="display:flex;gap:12px;align-items:center"><span class="dk-num">${checkedN}</span><h1 style="margin:0;font-size:26px">Checked, no change proposed</h1></header>
    <p class="dk-lead">Looked at while preparing this deck and left as it is, for the reason given. Add a note to anything you'd change anyway.</p>
    <div class="dk-smalls">${checked.map((c) => `<div class="dk-small dk-checked"><p><span class="dk-stitle">${c.title}</span>${c.why}</p>
    <textarea class="dk-note" data-id="${c.id}" data-f="note" placeholder="Notes"></textarea></div>`).join("")}</div></section>`;
}

html += `<section class="dk-slide dk-page dk-summary" data-key="summary"><h1>Your decisions</h1>
  <div class="dk-toc" id="toc"></div>
  <p class="dk-lead">Copy this and paste it back into the chat. Anything left undecided is listed as UNDECIDED. On undecided and dropped slides, only variants you picked are listed.</p>
  <textarea id="exportText" readonly></textarea>
  <div class="dk-row"><button class="dk-btn" id="copyBtn">Copy</button><span id="copied"></span></div></section>`;
document.getElementById("deck").innerHTML = html;

const selectedOption = (p, v) => state[p.id]?.[v.key] ?? v.options[0][0];

// A shot tied to variant options (shot's when) shows only while all of them are selected.
function showVariantShots(id) {
  const p = P.find((x) => x.id === id);
  if (!p) return;
  for (const fig of document.querySelectorAll(`.dk-slide[data-key="${id}"] .dk-shot[data-when]`)) {
    fig.hidden = !fig.dataset.when.split("&").every((pair) => {
      const [key, val] = pair.split("=");
      const v = p.variants.find((x) => x.key === key);
      return v && selectedOption(p, v) === val;
    });
  }
}

function markEmptyChangeNote(id) {
  const box = document.querySelector(`textarea.dk-note[data-id="${id}"]`);
  box.dataset.placeholder ??= box.placeholder;
  const want = decisionOf(id) === "change" && !state[id]?.note?.trim();
  box.classList.toggle("dk-want", want);
  box.placeholder = want ? "Say what to change" : box.dataset.placeholder;
}

// Restore saved answers; a variant with no answer yet shows its proposed option.
for (const el of document.querySelectorAll("[data-id]")) {
  const saved = state[el.dataset.id]?.[el.dataset.f];
  if (el.type === "radio") el.checked = saved !== undefined ? saved === el.value : el.hasAttribute("data-default");
  else if (saved !== undefined) el.value = saved;
  el.addEventListener(el.type === "radio" ? "change" : "input", () => {
    const id = el.dataset.id;
    state[id] ??= {};
    state[id][el.dataset.f] = el.value;
    save();
    markEmptyChangeNote(id);
    if (el.dataset.f === "decision") renderNav();
    else if (el.type === "radio") { showVariantShots(id); fit(); }
  });
}
for (const p of P) { showVariantShots(p.id); markEmptyChangeNote(p.id); }
for (const s of small) markEmptyChangeNote(s.id);

function exportText() {
  const lines = [`${DECK.title}: decisions`, ""];
  const note = (id) => state[id]?.note?.trim();
  for (const p of P) {
    lines.push(`${p.n}. ${p.title}: ${decisionOf(p.id).toUpperCase()}`);
    for (const v of p.variants) {
      // An untouched variant on an undecided or dropped proposal is only the preselection, not a choice.
      if (["undecided", "drop"].includes(decisionOf(p.id)) && state[p.id]?.[v.key] === undefined) continue;
      const val = selectedOption(p, v);
      lines.push(`   ${v.q.replace(/[?:]$/, "")}: ${v.options.find((o) => o[0] === val)[1]}`);
    }
    if (note(p.id)) lines.push(`   Note: ${note(p.id).replace(/\n/g, "\n         ")}`);
  }
  if (small.length) lines.push(`${smallN}. Small fixes`);
  for (const s of small) {
    lines.push(`   - ${s.title}: ${decisionOf(s.id).toUpperCase()}`);
    if (note(s.id)) lines.push(`     Note: ${note(s.id).replace(/\n/g, "\n           ")}`);
  }
  // A checked item has nothing to decide; only the ones the user wrote a note on are listed.
  const noted = checked.filter((c) => note(c.id));
  if (noted.length) lines.push(`${checkedN}. Checked, no change proposed`);
  for (const c of noted) lines.push(`   - ${c.title}\n     Note: ${note(c.id).replace(/\n/g, "\n           ")}`);
  return lines.join("\n");
}

// ---------- navigation ----------
const els = [...document.querySelectorAll(".dk-slide")];
// #N in the URL, the dots' data-go and the list's data-toc all count slides from 1, like the slide numbers.
const fromHash = () => (parseInt(location.hash.slice(1), 10) || 1) - 1;
let current = Math.min(Math.max(fromHash(), 0), els.length - 1);

function slideDecision(s) {
  if (s.p) return decisionOf(s.p.id);
  if (s.key === "small") {
    const d = small.map((x) => decisionOf(x.id));
    return d.every((x) => x !== "undecided") ? (d.includes("change") ? "change" : d.every((x) => x === "drop") ? "drop" : "keep") : "undecided";
  }
  return "undecided";
}

function renderNav() {
  document.getElementById("dots").innerHTML = slides.map((s, i) =>
    `<button class="${i === current ? "dk-on" : ""} dk-${slideDecision(s)}" data-go="${i + 1}" title="${s.p ? s.p.title : s.key}">${s.label}</button>`).join("");
  const rows = P.map((p) => [p.n, p.title, kindBadge(p.kind), decisionOf(p.id)]);
  if (small.length) rows.push([smallN, "Small fixes", "", slideDecision(slides[smallN - 1])]);
  if (checked.length) rows.push([checkedN, "Checked, no change proposed", "", checked.some((c) => state[c.id]?.note?.trim()) ? "noted" : ""]);
  document.getElementById("toc").innerHTML = rows.map(([n, t, badge, d]) =>
    `<button data-toc="${n}"><span class="dk-num">${n}</span>${t}<span style="margin-left:auto">${badge}</span><span class="dk-state dk-${d}">${d}</span></button>`).join("");
}

// Scale the visuals so everything on a slide fits the stage without scrolling. Small visuals grow too,
// up to MAX_ZOOM, so they don't sit in a mostly empty stage on a large window.
const MAX_ZOOM = 1.4;
function fit() {
  const slide = els[current];
  const shots = slide.querySelector(".dk-shots");
  if (!shots) return;
  shots.style.zoom = 1;
  const stage = slide.querySelector(".dk-stage").getBoundingClientRect();
  const scale = Math.min(MAX_ZOOM, (stage.width - 8) / shots.scrollWidth, (stage.height - 8) / shots.scrollHeight);
  shots.style.zoom = scale;
}

function go(i) {
  current = Math.min(Math.max(i, 0), els.length - 1);
  els.forEach((el, j) => el.classList.toggle("dk-on", j === current));
  history.replaceState(null, "", `#${current + 1}`);
  document.getElementById("counter").textContent = `${current + 1} / ${els.length}`;
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === els.length - 1;
  if (slides[current].key === "summary") { document.getElementById("exportText").value = exportText(); document.getElementById("copied").textContent = ""; }
  renderNav();
  fit();
}

// The contents list uses data-toc, so [data-go="N"] matches exactly one element: the dot.
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go], [data-toc]");
  if (b) go(+(b.dataset.go ?? b.dataset.toc) - 1);
});
window.addEventListener("hashchange", () => go(fromHash()));
document.addEventListener("keydown", (e) => {
  // The target is document itself when nothing has focus, and document has no .matches().
  if ((e.target instanceof Element && e.target.matches("textarea, input[type=text]")) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { go(current + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { go(current - 1); e.preventDefault(); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(els.length - 1);
});
// Radios keep focus after a click, and arrow keys would then change the answer instead of the slide.
document.addEventListener("change", (e) => { if (e.target.type === "radio") e.target.blur(); });
window.addEventListener("resize", fit);
document.fonts.ready.then(fit);

document.getElementById("prevBtn").onclick = () => go(current - 1);
document.getElementById("nextBtn").onclick = () => go(current + 1);
document.getElementById("exportBtn").onclick = () => go(els.length - 1);
document.getElementById("copyBtn").onclick = async () => {
  const t = document.getElementById("exportText");
  try { await navigator.clipboard.writeText(t.value); document.getElementById("copied").textContent = "Copied"; }
  catch { t.select(); document.getElementById("copied").textContent = "Press Ctrl+C to copy the selection"; }
};
document.getElementById("resetBtn").onclick = () => { if (confirm("Clear all answers?")) { localStorage.removeItem(KEY); location.reload(); } };
document.getElementById("hlToggle").onchange = (e) => { document.body.classList.toggle("dk-nohl", !e.target.checked); e.target.blur(); };
go(current);
</script>
</body>
</html>
