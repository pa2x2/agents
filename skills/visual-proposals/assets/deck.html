<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Proposals</title>
<style>
:root {
  --page: #eceef1; --page-card: #ffffff; --page-text: #16181d; --page-muted: #5d6470; --accent: #16181d; --hl: #f59e0b;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--page); color: var(--page-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

/* ---------- deck chrome ---------- */
.top { position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 50; display: flex; align-items: center; gap: 14px;
  padding: 0 24px; background: var(--page); border-bottom: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); }
.top h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
.top label { font-size: 14px; color: var(--page-muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.btn { font: inherit; font-size: 14px; border-radius: 999px; padding: 7px 16px; border: 1px solid transparent;
  cursor: pointer; background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; color: var(--page-text); border-color: color-mix(in srgb, var(--page-muted) 40%, transparent); }
.btn:disabled { opacity: .35; cursor: default; }

.deck { position: fixed; top: 56px; bottom: 56px; left: 0; right: 0; }
.slide { display: none; position: absolute; inset: 0; padding: 20px 24px 12px; }
.slide.on { display: grid; grid-template-columns: minmax(330px, 390px) 1fr; gap: 28px; }
.slide.page.on { display: block; overflow-y: auto; padding: 36px max(24px, calc(50% - 480px)); }
.side { overflow-y: auto; padding: 4px 8px 12px 2px; min-height: 0; }
.stage { display: flex; align-items: center; justify-content: center; overflow: hidden; min-width: 0; min-height: 0; }

.bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 16px;
  border-top: 1px solid color-mix(in srgb, var(--page-muted) 20%, transparent); background: var(--page); z-index: 50; }
.dots { display: flex; gap: 8px; align-items: center; }
.dots button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700;
  background: color-mix(in srgb, var(--page-muted) 18%, transparent); color: var(--page-muted); padding: 0; }
.dots button.on { border-color: var(--page-text); color: var(--page-text); }
.dots button.keep { background: #1fa46333; color: #178a4f; } .dots button.change { background: #e5a50a33; color: #a86a00; }
.dots button.drop { background: #e02e2a33; color: #c62b27; }
.counter { font-size: 13px; color: var(--page-muted); min-width: 120px; text-align: center; }
.hintkeys { position: fixed; right: 24px; bottom: 18px; font-size: 12.5px; color: var(--page-muted); z-index: 51; }
kbd { font-family: inherit; font-size: 12px; border: 1px solid color-mix(in srgb, var(--page-muted) 45%, transparent); border-bottom-width: 2px;
  border-radius: 5px; padding: 0 5px; background: var(--page-card); color: var(--page-text); }

.side header { display: flex; gap: 12px; align-items: flex-start; }
.num { font-weight: 700; font-size: 14px; background: var(--page-text); color: var(--page); border-radius: 999px; width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 2px; }
.side h2 { margin: 0; font-size: 20px; line-height: 1.3; }
/* Kind badges take their colour from --h, a hue set per kind in DECK.kinds. */
.kind { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; display: inline-block;
  background: hsl(var(--h) 85% 92%); color: hsl(var(--h) 70% 30%); }
.side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--page-muted); margin: 20px 0 6px; }
.side ul { margin: 0; padding-left: 18px; } .side li { font-size: 14px; line-height: 1.5; margin: 0 0 5px; }
.refs { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--page-muted); margin-top: 8px; line-height: 1.5; }

.decide { margin-top: 20px; padding: 16px; border-radius: 16px; background: var(--page-card); display: flex; flex-direction: column; gap: 14px; }
.decide .lbl { font-size: 12px; font-weight: 700; color: var(--page-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.seg { display: inline-flex; background: color-mix(in srgb, var(--page-muted) 14%, transparent); border-radius: 999px; padding: 3px; gap: 2px; }
.seg input { display: none; }
.seg label { font-size: 14px; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: var(--page-muted); }
.seg input:checked + label { background: var(--page); color: var(--page-text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg input[value=keep]:checked + label { color: #178a4f; } .seg input[value=drop]:checked + label { color: #c62b27; }
.seg input[value=change]:checked + label { color: #a86a00; }
.variant { display: flex; flex-direction: column; gap: 6px; }
.variant .q { font-size: 14px; font-weight: 600; }
.variant label { font-size: 14px; display: flex; gap: 8px; align-items: baseline; cursor: pointer; line-height: 1.4; }
.variant label span i { display: block; font-style: normal; color: var(--page-muted); font-size: 12.5px; }
textarea.note { width: 100%; min-height: 64px; resize: vertical; font: inherit; font-size: 14px; border-radius: 12px; padding: 10px 12px;
  background: var(--page); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
/* "Change" with no note leaves the change unsaid; the box asks for it. */
textarea.note.want { border: 2px solid #e5a50a; }
textarea.note.want::placeholder { color: #a86a00; }

.shots { display: flex; flex-wrap: nowrap; gap: 26px; align-items: flex-start; }
.shot { margin: 0; }
.shot figcaption { font-size: 13.5px; margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; max-width: 420px; min-height: 38px; line-height: 18px; }
.tagnow, .tagnew { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; text-transform: uppercase; letter-spacing: .04em; flex: none; }
.tagnow { background: color-mix(in srgb, var(--page-muted) 22%, transparent); color: var(--page-muted); }
.tagnew { background: var(--hl); color: #1a1200; }
.shot figcaption span:last-child { color: var(--page-muted); }

.page h1 { font-size: 34px; margin: 0 0 12px; }
.page .lead { font-size: 16px; line-height: 1.6; color: var(--page-muted); max-width: 820px; }
.page .lead b { color: var(--page-text); }
.legend { display: inline-block; outline: 2px dashed var(--hl); outline-offset: 2px; border-radius: 4px; padding: 0 4px; color: var(--page-text); }
.toc { margin-top: 28px; display: flex; flex-direction: column; gap: 8px; max-width: 820px; }
.toc button { font: inherit; text-align: left; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; border: none;
  background: var(--page-card); color: var(--page-text); cursor: pointer; font-size: 15.5px; }
.toc button:hover { outline: 2px solid color-mix(in srgb, var(--page-muted) 30%, transparent); }
.toc button .kind { margin-left: auto; }
.toc button .state { font-size: 12px; font-weight: 700; width: 64px; text-align: right; text-transform: uppercase; }
.state.keep { color: #178a4f; } .state.change { color: #a86a00; } .state.drop { color: #c62b27; } .state.undecided { color: var(--page-muted); font-weight: 500; }
.smalls { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 960px; }
.small { display: grid; grid-template-columns: 1fr auto; gap: 10px 22px; padding: 16px 18px; border-radius: 16px; background: var(--page-card); }
.small p { margin: 0; font-size: 14.5px; line-height: 1.5; }
.small p b { display: block; font-size: 15.5px; margin-bottom: 3px; }
.small textarea { grid-column: 1 / -1; min-height: 44px; }
.summary textarea { width: 100%; height: 48vh; font-family: ui-monospace, monospace; font-size: 13px; border-radius: 14px; padding: 14px;
  background: var(--page-card); color: var(--page-text); border: 1px solid color-mix(in srgb, var(--page-muted) 30%, transparent); margin-top: 18px; }
.summary .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
.summary .row span { color: var(--page-muted); font-size: 13px; }

/* ---------- change highlight ----------
   .hl is a block wrapper with position: relative for its tag.
   - "inline": wraps in an inline-block span instead, for a label in a row or a value in a table cell.
   - "abs": for an overlay, popover or dialog. The wrapper becomes the absolutely positioned box, so put
     the position (top/right/...) in hl()'s style argument and give the inner element position: static. */
.hl { position: relative; outline: 2px dashed var(--hl); outline-offset: 3px; border-radius: 12px; }
.hl.inline { display: inline-block; vertical-align: middle; }
.hl.abs { position: absolute; }
.hl[data-tag]::after { content: attr(data-tag); position: absolute; top: -13px; right: -4px; background: var(--hl); color: #1a1200;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; z-index: 40; white-space: nowrap; font-family: Helvetica, Arial, sans-serif; }
body.nohl .hl { outline: none; } body.nohl .hl::after { display: none; }

/* ========== EDIT: visual styles ==========
   Styles for what the slides show. A visual of an existing UI should look like that UI: take its
   colours, fonts and components from the project. Diagrams, code and tables can stay plain.
   Prefix classes with v- so they can't collide with the deck classes (.on, .page, .side, .num...). */
.v-card { width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); overflow: hidden; }
.v-row { padding: 12px 16px; border-bottom: 1px solid #ddd; }
.v-btn { display: inline-block; padding: 10px 18px; border-radius: 6px; background: #555; color: #fff; }
.v-muted { color: #777; }
.v-flow { display: flex; align-items: center; gap: 10px; }
.v-box { background: #fff; border: 1px solid #ccc; border-radius: 10px; padding: 12px 14px; font-size: 14px; white-space: nowrap; }
.v-toast { background: #222; color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
</style>
</head>
<body>
<div class="top">
  <h1 id="deckTitle"></h1>
  <label><input type="checkbox" id="hlToggle" checked /> Highlight changes</label>
  <button class="btn ghost" id="resetBtn">Reset answers</button>
  <button class="btn" id="exportBtn">Export decisions</button>
</div>
<div class="deck" id="deck"></div>
<div class="bottom">
  <button class="btn ghost" id="prevBtn">← Prev</button>
  <div class="dots" id="dots"></div>
  <span class="counter" id="counter"></span>
  <button class="btn ghost" id="nextBtn">Next →</button>
</div>
<div class="hintkeys"><kbd>←</kbd> <kbd>→</kbd> to navigate</div>
<script>
// ---------- helpers ----------
const hl = (tag, html, cls = "", style = "") => {
  const el = cls.split(" ").includes("inline") ? "span" : "div";
  return `<${el} class="hl ${cls}" ${tag ? `data-tag="${tag}"` : ""} style="${style}">${html}</${el}>`;
};
// kind is "now" (current state) or "new" (proposed). html is any markup: a UI mockup, a diagram,
// before/after code, a table, a screenshot. when ties the shot to variant options, e.g. { layout: "grid" }:
// it only shows while that option is selected, so a slide shows one proposed visual at a time.
const shot = (kind, caption, html, when = null) =>
  `<figure class="shot" ${when ? `data-when="${Object.entries(when).map(([k, v]) => `${k}=${v}`).join("&")}"` : ""}><figcaption><span class="${kind === "now" ? "tagnow" : "tagnew"}">${kind === "now" ? "Now" : "Proposed"}</span><span>${caption}</span></figcaption>${html}</figure>`;

// ========== EDIT: deck content ==========
const DECK = {
  title: "Project — proposals",
  // Answers persist in localStorage under this key. Use a new key per deck.
  storageKey: "project-proposals-v1",
  // Extra intro paragraph (HTML): suggested order, caveats such as "drawn, not screenshots".
  intro: "Nothing has been changed yet.",
  // Hue (0-360) per kind, used for the badge colour.
  kinds: { fix: { label: "Fix", hue: 3 }, change: { label: "Change", hue: 215 } },
};

// One slide per proposal, numbered in this order. The first option of each variant is the
// one you propose; it is preselected and labelled "(proposed)".
const P = [
{
  id: "p1", kind: "fix", title: "Example: the save button says what it does",
  problem: ["The button reads <b>Submit</b> on a screen that only saves a draft."],
  proposal: ["Rename it to <b>Save draft</b>.", "Show <i>Saved</i> for two seconds after it succeeds."],
  refs: "src/screens/Editor.tsx",
  variants: [{ key: "confirm", q: "How should a save be confirmed?", options: [
    ["inline", "Inline “Saved” label", "Quiet, next to the button."],
    ["toast", "Toast", "More visible, covers content briefly."],
  ]}],
  shots: [
    shot("now", "Current editor", `<div class="v-card"><div class="v-row">Title</div><div class="v-row v-muted">Body…</div>
      <div style="padding:16px"><span class="v-btn">Submit</span></div></div>`),
    shot("new", "Inline confirmation", `<div class="v-card"><div class="v-row">Title</div><div class="v-row v-muted">Body…</div>
      <div style="padding:16px;display:flex;align-items:center;gap:12px">${hl("renamed", `<span class="v-btn">Save draft</span>`, "", "border-radius:6px")}${hl("new", `<span class="v-muted">Saved</span>`, "inline", "border-radius:4px")}</div></div>`,
      { confirm: "inline" }),
    shot("new", "Toast confirmation", `<div class="v-card" style="position:relative"><div class="v-row">Title</div><div class="v-row v-muted">Body…</div>
      <div style="padding:16px 16px 72px">${hl("renamed", `<span class="v-btn">Save draft</span>`, "inline", "border-radius:6px")}</div>
      ${hl("new", `<div class="v-toast">Draft saved</div>`, "abs", "left:16px;right:16px;bottom:14px;border-radius:8px")}</div>`,
      { confirm: "toast" }),
  ],
},
{
  id: "p2", kind: "change", title: "Example: retries move out of the request handler",
  problem: ["While the upstream API is slow, the handler retries it and keeps the client's request open."],
  proposal: ["Queue the call and retry it in a background worker.", "The handler answers 202 right away."],
  refs: "src/api/handler.ts · src/jobs/",
  variants: [],
  shots: [
    shot("now", "Request path", `<div class="v-flow"><div class="v-box">Client</div>→<div class="v-box">Handler<br><span class="v-muted">retries ×3</span></div>→<div class="v-box">Upstream API</div></div>`),
    shot("new", "Request path", `<div class="v-flow"><div class="v-box">Client</div>→<div class="v-box">Handler</div>→${hl("new", `<div class="v-box">Queue</div>`, "", "border-radius:10px")}→${hl("new", `<div class="v-box">Worker<br><span class="v-muted">retries ×3</span></div>`, "", "border-radius:10px")}→<div class="v-box">Upstream API</div></div>`),
  ],
},
];

// Small, self-explanatory fixes on one slide, each decided separately. Leave empty to hide the slide.
const SMALL = [
  { id: "s1", title: "Example small fix", text: "One or two sentences on the problem and the fix. (file.ts)" },
];

// ---------- rendering + decisions ----------
const KEY = DECK.storageKey;
const state = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(state));
const decisionOf = (id) => state[id]?.decision ?? "undecided";
const kindBadge = (k) => `<span class="kind" style="--h:${DECK.kinds[k]?.hue ?? 220}">${DECK.kinds[k]?.label ?? k}</span>`;
P.forEach((p, i) => { p.n = i + 1; });
const smallN = P.length + 1;

const decisionSeg = (id) => `<div class="seg">${["keep", "change", "drop"].map((v) =>
  `<input type="radio" name="${id}-d" id="${id}-${v}" value="${v}" data-id="${id}" data-f="decision"><label for="${id}-${v}">${v[0].toUpperCase() + v.slice(1)}</label>`).join("")}</div>`;

const slides = [{ key: "intro", label: "i" }, ...P.map((p) => ({ key: p.id, label: String(p.n), p })),
  ...(SMALL.length ? [{ key: "small", label: String(smallN) }] : []), { key: "summary", label: "✓" }];

document.title = DECK.title;
document.getElementById("deckTitle").textContent = DECK.title;

let html = `<section class="slide page" data-key="intro">
  <h1>${DECK.title}</h1>
  <p class="lead">Each slide shows <b>how it is now</b> next to the <b>proposed</b> version.
  Parts marked with a <span class="legend">dashed outline</span> are what changes.<br/><br/>
  For each proposal pick <b>Keep</b>, <b>Change</b> or <b>Drop</b>, choose a variant where there is one, and add notes. Answers are saved in this browser.
  The last slide collects everything, ready to copy and paste back into the chat. Use <kbd>←</kbd> <kbd>→</kbd> to move between slides.<br/><br/>
  ${DECK.intro}</p>
  <div class="toc" id="toc"></div></section>`;

for (const p of P) {
  html += `<section class="slide" data-key="${p.id}"><div class="side">
    <header><span class="num">${p.n}</span><div><h2>${p.title}</h2><div style="margin-top:6px">${kindBadge(p.kind)}</div></div></header>
    <h3>Problem</h3><ul>${p.problem.map((x) => `<li>${x}</li>`).join("")}</ul>
    <h3>Proposal</h3><ul>${p.proposal.map((x) => `<li>${x}</li>`).join("")}</ul>
    ${p.refs ? `<div class="refs">${p.refs}</div>` : ""}
    <div class="decide"><div><div class="lbl">Decision</div>${decisionSeg(p.id)}</div>
    ${p.variants.map((v) => `<div class="variant"><div class="q">${v.q}</div>${v.options.map(([val, label, hint], i) =>
      `<label><input type="radio" name="${p.id}-${v.key}" value="${val}" data-id="${p.id}" data-f="${v.key}" ${i === 0 ? "data-default" : ""}><span>${label}${i === 0 ? " (proposed)" : ""}${hint ? `<i>${hint}</i>` : ""}</span></label>`).join("")}</div>`).join("")}
    <div><div class="lbl">Notes</div><textarea class="note" data-id="${p.id}" data-f="note" placeholder="What would you change?"></textarea></div></div>
  </div><div class="stage"><div class="shots">${p.shots.join("")}</div></div></section>`;
}

if (SMALL.length) {
  html += `<section class="slide page" data-key="small"><header style="display:flex;gap:12px;align-items:center"><span class="num">${smallN}</span><h1 style="margin:0;font-size:26px">Small fixes</h1></header>
    <div class="smalls">${SMALL.map((s) => `<div class="small"><p><b>${s.title}</b>${s.text}</p><div>${decisionSeg(s.id)}</div>
    <textarea class="note" data-id="${s.id}" data-f="note" placeholder="Notes"></textarea></div>`).join("")}</div></section>`;
}

html += `<section class="slide page summary" data-key="summary"><h1>Your decisions</h1>
  <p class="lead">Copy this and paste it back into the chat. Anything left undecided is listed as UNDECIDED.</p>
  <textarea id="exportText" readonly></textarea>
  <div class="row"><button class="btn" id="copyBtn">Copy</button><span id="copied"></span></div></section>`;
document.getElementById("deck").innerHTML = html;

const selectedOption = (p, v) => state[p.id]?.[v.key] ?? v.options[0][0];

// A shot tied to variant options (shot's when) shows only while all of them are selected.
function showVariantShots(id) {
  const p = P.find((x) => x.id === id);
  if (!p) return;
  for (const fig of document.querySelectorAll(`.slide[data-key="${id}"] .shot[data-when]`)) {
    fig.hidden = !fig.dataset.when.split("&").every((pair) => {
      const [key, val] = pair.split("=");
      const v = p.variants.find((x) => x.key === key);
      return v && selectedOption(p, v) === val;
    });
  }
}

function markEmptyChangeNote(id) {
  const box = document.querySelector(`textarea.note[data-id="${id}"]`);
  box.dataset.placeholder ??= box.placeholder;
  const want = decisionOf(id) === "change" && !state[id]?.note?.trim();
  box.classList.toggle("want", want);
  box.placeholder = want ? "Say what to change" : box.dataset.placeholder;
}

// Restore saved answers; a variant with no answer yet shows its proposed option.
for (const el of document.querySelectorAll("[data-id]")) {
  const saved = state[el.dataset.id]?.[el.dataset.f];
  if (el.type === "radio") el.checked = saved !== undefined ? saved === el.value : el.hasAttribute("data-default");
  else if (saved !== undefined) el.value = saved;
  el.addEventListener(el.type === "radio" ? "change" : "input", () => {
    const id = el.dataset.id;
    state[id] ??= {};
    state[id][el.dataset.f] = el.value;
    save();
    markEmptyChangeNote(id);
    if (el.dataset.f === "decision") renderNav();
    else if (el.type === "radio") { showVariantShots(id); fit(); }
  });
}
for (const p of P) { showVariantShots(p.id); markEmptyChangeNote(p.id); }
for (const s of SMALL) markEmptyChangeNote(s.id);

function exportText() {
  const lines = [`${DECK.title}: decisions`, ""];
  const note = (id) => state[id]?.note?.trim();
  for (const p of P) {
    lines.push(`${p.n}. ${p.title}: ${decisionOf(p.id).toUpperCase()}`);
    for (const v of p.variants) {
      // An untouched variant on an undecided proposal is only the preselection, not a choice.
      if (decisionOf(p.id) === "undecided" && state[p.id]?.[v.key] === undefined) continue;
      const val = selectedOption(p, v);
      lines.push(`   ${v.q.replace(/[?:]$/, "")}: ${v.options.find((o) => o[0] === val)[1]}`);
    }
    if (note(p.id)) lines.push(`   Note: ${note(p.id).replace(/\n/g, "\n         ")}`);
  }
  if (SMALL.length) lines.push(`${smallN}. Small fixes`);
  for (const s of SMALL) {
    lines.push(`   - ${s.title}: ${decisionOf(s.id).toUpperCase()}`);
    if (note(s.id)) lines.push(`     Note: ${note(s.id).replace(/\n/g, "\n           ")}`);
  }
  return lines.join("\n");
}

// ---------- navigation ----------
const els = [...document.querySelectorAll(".slide")];
let current = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 0, 0), els.length - 1);

function slideDecision(s) {
  if (s.p) return decisionOf(s.p.id);
  if (s.key === "small") {
    const d = SMALL.map((x) => decisionOf(x.id));
    return d.every((x) => x !== "undecided") ? (d.includes("change") ? "change" : d.every((x) => x === "drop") ? "drop" : "keep") : "undecided";
  }
  return "undecided";
}

function renderNav() {
  document.getElementById("dots").innerHTML = slides.map((s, i) =>
    `<button class="${i === current ? "on" : ""} ${slideDecision(s)}" data-go="${i}" title="${s.p ? s.p.title : s.key}">${s.label}</button>`).join("");
  const rows = P.map((p, i) => [i + 1, p.n, p.title, kindBadge(p.kind), decisionOf(p.id)]);
  if (SMALL.length) rows.push([smallN, smallN, "Small fixes", "", slideDecision(slides[smallN])]);
  document.getElementById("toc").innerHTML = rows.map(([go, n, t, badge, d]) =>
    `<button data-toc="${go}"><span class="num">${n}</span>${t}<span style="margin-left:auto">${badge}</span><span class="state ${d}">${d}</span></button>`).join("");
}

// Scale the visuals down so everything on a slide fits the stage without scrolling.
function fit() {
  const slide = els[current];
  const shots = slide.querySelector(".shots");
  if (!shots) return;
  shots.style.zoom = 1;
  const stage = slide.querySelector(".stage").getBoundingClientRect();
  const scale = Math.min(1, (stage.width - 8) / shots.scrollWidth, (stage.height - 8) / shots.scrollHeight);
  shots.style.zoom = scale;
}

function go(i) {
  current = Math.min(Math.max(i, 0), els.length - 1);
  els.forEach((el, j) => el.classList.toggle("on", j === current));
  history.replaceState(null, "", `#${current}`);
  document.getElementById("counter").textContent = `${current + 1} / ${els.length}`;
  document.getElementById("prevBtn").disabled = current === 0;
  document.getElementById("nextBtn").disabled = current === els.length - 1;
  if (slides[current].key === "summary") { document.getElementById("exportText").value = exportText(); document.getElementById("copied").textContent = ""; }
  renderNav();
  fit();
}

// The contents list uses data-toc, so [data-go="N"] matches exactly one element: the dot.
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go], [data-toc]");
  if (b) go(+(b.dataset.go ?? b.dataset.toc));
});
window.addEventListener("hashchange", () => go(parseInt(location.hash.slice(1), 10) || 0));
document.addEventListener("keydown", (e) => {
  // The target is document itself when nothing has focus, and document has no .matches().
  if ((e.target instanceof Element && e.target.matches("textarea, input[type=text]")) || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { go(current + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { go(current - 1); e.preventDefault(); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(els.length - 1);
});
// Radios keep focus after a click, and arrow keys would then change the answer instead of the slide.
document.addEventListener("change", (e) => { if (e.target.type === "radio") e.target.blur(); });
window.addEventListener("resize", fit);
document.fonts.ready.then(fit);

document.getElementById("prevBtn").onclick = () => go(current - 1);
document.getElementById("nextBtn").onclick = () => go(current + 1);
document.getElementById("exportBtn").onclick = () => go(els.length - 1);
document.getElementById("copyBtn").onclick = async () => {
  const t = document.getElementById("exportText");
  try { await navigator.clipboard.writeText(t.value); document.getElementById("copied").textContent = "Copied"; }
  catch { t.select(); document.getElementById("copied").textContent = "Press Ctrl+C to copy the selection"; }
};
document.getElementById("resetBtn").onclick = () => { if (confirm("Clear all answers?")) { localStorage.removeItem(KEY); location.reload(); } };
document.getElementById("hlToggle").onchange = (e) => { document.body.classList.toggle("nohl", !e.target.checked); e.target.blur(); };
go(current);
</script>
</body>
</html>
